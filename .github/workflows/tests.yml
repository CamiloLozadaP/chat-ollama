# Ejecuta los tests automáticamente en GitHub cada vez que se hace push o se abre un pull request.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Los tests solo necesitan la librería de Ollama (no el servidor) y pytest.
      - name: Instalar dependencias
        run: pip install ollama pytest

      - name: Ejecutar tests
        run: python -m pytest -v
